<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbaf8"/>
      <stop offset="0.55" stop-color="#c5dcfb"/>
      <stop offset="1" stop-color="#ffe6c4"/>
    </linearGradient>
    <pattern id="win" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="6" height="8" fill="#ffffff" opacity="0.75"/>
    </pattern>
    <g id="car">
      <rect x="0" y="10" width="64" height="20" rx="6" fill="currentColor"/>
      <path d="M12 10 L20 0 H46 L54 10 Z" fill="currentColor"/>
      <path d="M17 9 L23 2 H31 V9 Z M35 9 V2 H44 L50 9 Z" fill="#cfe3f5" opacity="0.85"/>
      <circle cx="15" cy="30" r="6" fill="#14171c"/>
      <circle cx="49" cy="30" r="6" fill="#14171c"/>
      <circle cx="15" cy="30" r="2.5" fill="#9aa3af"/>
      <circle cx="49" cy="30" r="2.5" fill="#9aa3af"/>
    </g>
    <g id="bike">
      <circle cx="8" cy="20" r="7" fill="none" stroke="#46526b" stroke-width="2"/>
      <circle cx="32" cy="20" r="7" fill="none" stroke="#46526b" stroke-width="2"/>
      <path d="M8 20 L18 8 H26 L32 20 M18 8 L22 20 H8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M26 8 L24 3 H29" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- sky and sun -->
  <rect width="900" height="400" fill="url(#sky)"/>
  <circle cx="700" cy="352" r="78" fill="#fff1cf" opacity="0.95"/>

  <!-- skyline -->
  <g fill="#8aa6d3">
    <rect x="18" y="236" width="62" height="164"/>
    <rect x="92" y="290" width="50" height="110"/>
    <rect x="152" y="206" width="72" height="194"/>
    <rect x="234" y="300" width="48" height="100"/>
    <rect x="622" y="222" width="62" height="178"/>
    <rect x="694" y="272" width="80" height="128"/>
    <rect x="784" y="196" width="98" height="204"/>
  </g>
  <g fill="url(#win)">
    <rect x="18" y="236" width="62" height="164"/>
    <rect x="152" y="206" width="72" height="194"/>
    <rect x="622" y="222" width="62" height="178"/>
    <rect x="784" y="196" width="98" height="204"/>
    <rect x="694" y="272" width="80" height="128"/>
  </g>

  <!-- mall -->
  <rect x="300" y="292" width="300" height="108" fill="#ffffff"/>
  <rect x="300" y="292" width="300" height="22" fill="#3a6ae0"/>
  <rect x="318" y="326" width="264" height="42" fill="#bcd3f7" opacity="0.9"/>
  <rect x="432" y="344" width="36" height="56" fill="#3a6ae0"/>
  <rect x="426" y="246" width="48" height="46" rx="6" fill="#3a6ae0"/>
  <text x="450" y="283" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#ffffff">P</text>

  <!-- surface road with two cars -->
  <rect x="0" y="388" width="900" height="12" fill="#7d8aa3"/>
  <line x1="0" y1="394" x2="900" y2="394" stroke="#f5b800" stroke-width="2" stroke-dasharray="20 14"/>
  <use href="#car" x="96" y="352" color="#e4572e"/>
  <use href="#car" x="690" y="352" color="#f5b800"/>

  <!-- underground -->
  <rect x="0" y="400" width="900" height="300" fill="#e3e9f3"/>
  <rect x="0" y="400" width="900" height="10" fill="#b4bfd3"/>
  <rect x="0" y="536" width="900" height="14" fill="#b4bfd3"/>

  <!-- ramp -->
  <polygon points="772,410 900,410 900,520" fill="#cdd6e6"/>
  <polygon points="800,430 840,430 840,420 866,442 840,464 840,454 800,454" fill="#f5b800" opacity="0.9"/>

  <!-- Basement 1: cars -->
  <text x="40" y="436" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#3a4a68">Basement 1</text>
  <g fill="#8794ad" opacity="0.85">
    <rect x="40" y="470" width="2" height="50"/><rect x="125" y="470" width="2" height="50"/>
    <rect x="210" y="470" width="2" height="50"/><rect x="295" y="470" width="2" height="50"/>
    <rect x="380" y="470" width="2" height="50"/><rect x="465" y="470" width="2" height="50"/>
    <rect x="550" y="470" width="2" height="50"/><rect x="635" y="470" width="2" height="50"/>
    <rect x="720" y="470" width="2" height="50"/>
  </g>
  <use href="#car" x="50" y="484" color="#d9534f"/>
  <use href="#car" x="135" y="484" color="#3b82c4"/>
  <rect x="224" y="476" width="66" height="42" rx="5" fill="rgba(47,174,107,0.18)" stroke="#2fae6b" stroke-width="2" stroke-dasharray="6 4"/>
  <use href="#car" x="305" y="484" color="#5b6b8c"/>
  <use href="#car" x="390" y="484" color="#7a4bd6"/>
  <use href="#car" x="475" y="484" color="#6b7280"/>
  <use href="#car" x="560" y="484" color="#e4572e"/>
  <rect x="649" y="476" width="66" height="42" rx="5" fill="rgba(245,184,0,0.22)" stroke="#f5b800" stroke-width="2.5"/>
  <rect x="640" y="436" width="84" height="24" rx="6" fill="#f5b800"/>
  <polygon points="676,460 688,460 682,468" fill="#f5b800"/>
  <text x="682" y="453" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f232b">Park here</text>
  <g fill="#9aa6bd">
    <rect x="288" y="446" width="14" height="74"/>
    <rect x="628" y="446" width="14" height="74"/>
  </g>
  <rect x="0" y="520" width="900" height="16" fill="#cfd8e8"/>
  <line x1="0" y1="528" x2="772" y2="528" stroke="#f5b800" stroke-width="2" stroke-dasharray="18 12"/>

  <!-- Basement 2: bikes -->
  <text x="40" y="578" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#3a4a68">Basement 2</text>
  <g fill="#8794ad" opacity="0.85">
    <rect x="40" y="636" width="2" height="48"/><rect x="104" y="636" width="2" height="48"/>
    <rect x="168" y="636" width="2" height="48"/><rect x="232" y="636" width="2" height="48"/>
    <rect x="296" y="636" width="2" height="48"/><rect x="360" y="636" width="2" height="48"/>
    <rect x="424" y="636" width="2" height="48"/><rect x="488" y="636" width="2" height="48"/>
    <rect x="552" y="636" width="2" height="48"/><rect x="616" y="636" width="2" height="48"/>
    <rect x="680" y="636" width="2" height="48"/><rect x="744" y="636" width="2" height="48"/>
  </g>
  <use href="#bike" x="52" y="657" color="#e4572e"/>
  <use href="#bike" x="116" y="657" color="#3b82c4"/>
  <rect x="172" y="644" width="56" height="38" rx="5" fill="rgba(47,174,107,0.18)" stroke="#2fae6b" stroke-width="2" stroke-dasharray="6 4"/>
  <use href="#bike" x="244" y="657" color="#d9534f"/>
  <use href="#bike" x="308" y="657" color="#f5b800"/>
  <use href="#bike" x="372" y="657" color="#7a4bd6"/>
  <use href="#bike" x="436" y="657" color="#3b82c4"/>
  <use href="#bike" x="500" y="657" color="#7a4bd6"/>
  <rect x="556" y="644" width="56" height="38" rx="5" fill="rgba(47,174,107,0.18)" stroke="#2fae6b" stroke-width="2" stroke-dasharray="6 4"/>
  <use href="#bike" x="628" y="657" color="#e4572e"/>
  <use href="#bike" x="692" y="657" color="#6b7280"/>
  <use href="#bike" x="756" y="657" color="#d9534f"/>
  <g fill="#9aa6bd">
    <rect x="289" y="618" width="14" height="66"/>
    <rect x="609" y="618" width="14" height="66"/>
  </g>
  <rect x="0" y="684" width="900" height="16" fill="#cfd8e8"/>
</svg>
