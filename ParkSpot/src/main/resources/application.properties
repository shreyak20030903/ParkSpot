spring.application.name=ParkSpot

# Render gives the port in PORT. Locally it stays 8080.
server.port=${PORT:8080}

# ---- MySQL ----
# Locally these defaults are used. On Render, set DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parkspot?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# ---- Redis ----
# One URL for everything. Use rediss:// (two s) when the provider needs TLS.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# ---- JWT ----
jwt.secret=${JWT_SECRET}

# ---- Which websites may call this backend (comma separated, no trailing slash) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
